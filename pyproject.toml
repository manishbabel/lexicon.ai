[project]
name = "lexicon-ai"
version = "0.1.0"
description = "Real-time meeting assistant with AI-powered suggestions and terminology intelligence"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14.0",
    "openai>=2.29.0",
    "apscheduler>=3.10",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-frontmatter>=1.1",
    "watchfiles>=1.0",
    "httpx>=0.28",
    "deepgram-sdk>=3.8",
    "litellm>=1.82.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
